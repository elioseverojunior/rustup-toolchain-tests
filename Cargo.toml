[workspace]
members = ["crates/*"]
resolver = "3"

# Inheritance source for every member's `[package]`. `name` is intentionally
# absent — it is not an inheritable key (members must be uniquely named), and
# listing it here only produced an "unused manifest key" warning.
#
# >>> PER-PROJECT. Cloning this template to reserve a new crates.io name means
# editing project identity in exactly five places — every other config here is
# written to be project-agnostic and needs no edit:
#   1. this block (description / keywords / categories / documentation / repository)
#   2. crates/<member>/Cargo.toml  -> `name`, and the directory name itself
#   3. REUSE.toml                  -> SPDX-PackageName / DownloadLocation only.
#                                     The copyright fields name the HOLDER, not
#                                     the project, so the per-file SPDX headers
#                                     need no edit on a rename.
#   4. cliff.toml                  -> the three changelog GitHub URLs
#   5. README.md                   -> shipped in the .crate and rendered on
#                                     crates.io, so it is public identity too
#
# `mise run rename <new-name>` does all five (preview by default, --apply to
# write). It discovers the files instead of reading this list, so it also covers
# Cargo.lock — generated, so not an "edit", but it does carry the package name.
#
# The fields in THIS block are PUBLISHED and immutable per version. crates.io
# cannot edit them after upload — only a newer version can change what the crate
# page shows — so get them right before the first publish.
[workspace.package]
authors = ["Elio Severo Junior <elioseverojunior@gmail.com>"]
categories = ["development-tools", "config"]
description = "Generate .gitignore files from a declarative TOML specification."
documentation = "https://docs.rs/rustup-toolchain-tests"
edition = "2024"
keywords = ["gitignore", "git", "codegen", "toml", "config"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/elioseverojunior/rustup-toolchain-tests"
rust-version = "1.88"
version = "0.0.0"

# Files kept OUT of the published `.crate` tarball. This list previously sat
# inside `[workspace.metadata.docs.rs]`, where nothing read it — `exclude` is a
# package key, so it belongs here, and members opt in with `exclude.workspace =
# true`. Cargo already skips VCS-ignored paths, so most entries are belt-and-
# braces; the globs naming workspace-root paths (`.github/`, `.cargo/`) are
# inert for a member package and kept only to document intent.
exclude = [
  # Editor and OS files
  "*.bak",
  "*.log",
  "*.profdata",
  "*.profraw",
  "*.swo",
  "*.swp",
  "*.tmp",
  "*~",
  ".DS_Store",
  "Thumbs.db",
  # Development tools and configs
  ".cargo/",
  ".claude/",
  ".clippy.toml",
  ".idea/",
  ".pre-commit-config.yaml",
  ".rumdl.toml",
  ".secrets.baseline",
  ".vscode/",
  "deny.toml",
  # Version control
  ".git/",
  ".gitattributes",
  ".githooks/",
  ".gitignore",
  ".gitmessage",
  # CI/CD
  ".github/",
  ".gitlab-ci.yml",
  ".travis.yml",
  "GitVersion.yml",
  "Makefile",
  "commitlint.config.js",
  # Documentation and community files
  "CLAUDE.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "docs/",
  # For libraries, the lockfile is advisory only
  "Cargo.lock",
  # Node.js/JavaScript files
  "node_modules/",
  "package-lock.json",
  "package.json",
  # Build artifacts and caches
  "lcov.info",
  "target/",
  # Benchmarks and fixtures (tests/ stays in so `cargo test` works downstream;
  # examples/ stays in so docs.rs can render them)
  "benches/",
  "test-data/",
]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
collapsible_if = "allow"

# Lint GROUPS this workspace opts into (all default to `allow`; we raise them to
# `warn`). priority = -1 so the per-lint overrides further down win over the
# groups (clippy requires group priority < lint priority for the override to
# apply). NOTE on "warn" vs "deny": the warnings-as-errors policy lives in ONE
# place — `-D warnings` in .cargo/config.toml — which escalates EVERY warning
# (rustc + clippy, local + CI) into a hard error. So "warn" here already means
# "deny in practice"; writing "deny" per-group would scatter that single policy.
#   * pedantic — stricter, opinionated correctness/clarity lints.
#   * nursery  — newer lints still being refined (may evolve); enabled per request.
#   * cargo    — Cargo.toml hygiene: wildcard/`*` deps, missing metadata, feature names.
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# --- per-lint opt-ins (individual `restriction`-group lints) -----------------
# The `restriction` group as a whole is too opinionated (many mutually exclusive
# lints) to enable, so we opt in to just the two that the project's .clippy.toml
# already tunes: production code must not `.unwrap()`/`.expect()` (a panic is a
# DoS per CLAUDE.md), while `allow-unwrap-in-tests`/`allow-expect-in-tests` in
# .clippy.toml keep them ergonomic inside `#[cfg(test)]`.
expect_used = "warn"
unwrap_used = "warn"

# --- per-lint opt-outs (default priority 0, so they outrank the groups above) ---
# Duplicate *transitive* dependency versions are pulled in by upstream crates and
# are outside this project's control; the rest of `cargo` stays a hard gate.
multiple_crate_versions = "allow"

# `redundant_pub_crate` (nursery) directly CONTRADICTS the stable rustc
# `unreachable_pub` lint in [workspace.lints.rust]: the former wants `pub` on a
# `pub(crate)` item inside a private module, the latter wants `pub(crate)` on a
# `pub` item that isn't externally reachable. They can't both be satisfied, so the
# nursery lint yields to the stable one — `pub(crate)` is the correct visibility.
redundant_pub_crate = "allow"

# Single version registry for the whole workspace: third-party crates AND future
# internal crates are declared here once, and members bind with
# `<crate>.workspace = true`. This is also where BUILD-dependencies come from —
# Cargo has no `[workspace.build-dependencies]` table, so the `chrono` that
# crates/<member>/build.rs needs is declared here and inherited by its
# `[build-dependencies]`.
#
# When internal crates are added, their `version` must match
# `workspace.package.version` (0.0.0) — a path dependency's version requirement
# is still checked against the real crate version, so a stale pin (e.g. 0.1.0)
# would fail to resolve.
[workspace.dependencies]
chrono = "0.4.45"

# NOTE: docs.rs settings deliberately do NOT live here. docs.rs reads
# `package.metadata.docs.rs` from the published crate and ignores
# `[workspace.metadata]`, so they are declared in crates/<member>/Cargo.toml.
