#
# gitleaks configuration ~ https://github.com/gitleaks/gitleaks
#
# Inherits the full upstream ruleset (AWS, GCP, GitHub, Slack, private keys, …)
# via [extend] and layers repo-specific allowlists to suppress known false
# positives. detect-secrets (.secrets.baseline) runs alongside this — the two
# are complementary scanners, not redundant.

title = "Workspace gitleaks config"

[extend]
# Pull in gitleaks' maintained ruleset rather than re-deriving ~150 rules here.
# Upstream rule fixes then flow in on every gitleaks upgrade.
useDefault = true

[[allowlists]]
description = "Repo-wide false positives: vendored data, generated/build files, license texts"
# `paths` are regexes matched against the file path (relative to repo root).
# Allowlisting by path keeps detection strong on real source while carving out
# files that are data, not credentials.
paths = [
  # Model weights and tokenizer vocabularies — binary/high-entropy data that
  # trips the generic entropy heuristics but contains no credentials.
  '''(^|/)models/.*''',
  '''\.(safetensors|gguf|onnx|bin|pt)$''',
  # Cargo's lockfile — package checksums trip entropy heuristics.
  '''Cargo\.lock$''',
  # Build artifacts (gitignored, but excluded here for `gitleaks dir` scans).
  '''target/.*''',
  # detect-secrets baseline stores hashes/snippets of already-flagged strings.
  '''\.secrets\.baseline$''',
  # License texts and their per-crate symlinks.
  '''LICENSES/.*''',
  '''(^|/)LICENSE-(MIT|APACHE)$''',
  # This config itself, so any example patterns below never self-trigger.
  '''\.gitleaks\.toml$''',
]

